<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Camp Split</title>
    <meta name="description" content="Fair camping expense splitter with dark mode, multi-device Google Drive sync, receipt photo uploads, and QR code link sharing." />
    <meta property="og:title" content="Camp Split" />
    <meta property="og:description" content="Fair camping expense splitter with dark mode, multi-device Google Drive sync, receipt photo uploads, and QR code link sharing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="referrer" content="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('campsplit-dark-mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var loadedFallback = false;
        function bootStaticFallback() {
          if (window.__CAMP_SPLIT_MOUNTED__ || loadedFallback) return;
          loadedFallback = true;
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './gh-pages/app.css';
          document.head.appendChild(css);
          var js = document.createElement('script');
          js.type = 'module';
          js.src = './gh-pages/app.js';
          document.body.appendChild(js);
        }
        window.addEventListener('load', bootStaticFallback);
        setTimeout(bootStaticFallback, 1200);
      })();
    </script>
  </body>
</html>
